name: Frontend validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python static test dependencies
        run: python3 -m pip install pytest numpy scipy

      - name: Static frontend contract tests
        run: |
          python3 -m pytest tests/test_frontend_validation_panel.py -q
          python3 -m pytest tests/test_frontend_accessibility.py -q

      - name: Static release manifest smoke
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("frontend") if Path("frontend/data").exists() else Path(".")
          manifest = json.loads((root / "data" / "release_manifest.json").read_text(encoding="utf-8"))
          catalog = json.loads((root / "data" / "factor_catalog.json").read_text(encoding="utf-8"))
          audit = json.loads((root / "data" / "factor_audit" / "index.json").read_text(encoding="utf-8"))
          assert manifest["factor_count"] == len(catalog)
          assert manifest["audit_factor_count"] == audit["n_factors"] == len(audit["factors"])
          assert "DEPLOY_VERSION" not in (root / "index.html").read_text(encoding="utf-8")
          if (root / "factor_audit.html").exists():
              assert "DEPLOY_VERSION" not in (root / "factor_audit.html").read_text(encoding="utf-8")
          PY

      - name: JavaScript syntax checks
        run: |
          if [ -f frontend/app.js ]; then
            node --check frontend/app_holding_scope.js
            node --check frontend/app.js
          else
            node --check app_holding_scope.js
            node --check app.js
          fi
          node --check e2e/compose_validation.mjs
          node --check e2e/run_compose_validation.mjs
          node --check e2e/online_compose_validation.mjs
          node --check e2e/perf_budget.mjs
          node --check e2e/accessibility_validation.mjs

  online-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install browser test dependencies
        run: npm ci --prefix e2e

      - name: Show Chrome version
        run: google-chrome --version

      - name: Wait for Pages and validate the live release
        env:
          ONLINE_E2E_URL: https://fifamy.github.io/factor-lib/
          ONLINE_E2E_BROWSER: "1"
          ONLINE_WAIT_TIMEOUT_MS: "900000"
          ONLINE_WAIT_INTERVAL_MS: "15000"
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          PERF_BUDGET_MULTIPLIER: "3"
        run: node e2e/online_compose_validation.mjs
