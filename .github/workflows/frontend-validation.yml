name: Frontend validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Static frontend contract tests
        run: python3 -m pytest tests/test_frontend_validation_panel.py -q

      - name: JavaScript syntax checks
        run: |
          if [ -f frontend/app.js ]; then
            node --check frontend/app.js
          else
            node --check app.js
          fi
          node --check e2e/compose_validation.mjs
          node --check e2e/run_compose_validation.mjs
          node --check e2e/online_compose_validation.mjs
