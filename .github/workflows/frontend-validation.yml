name: Frontend validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python static test dependencies
        run: python3 -m pip install pytest numpy scipy

      - name: Static frontend contract tests
        run: python3 -m pytest tests/test_frontend_validation_panel.py -q

      - name: Static release manifest smoke
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("frontend") if Path("frontend/data").exists() else Path(".")
          manifest = json.loads((root / "data" / "release_manifest.json").read_text(encoding="utf-8"))
          catalog = json.loads((root / "data" / "factor_catalog.json").read_text(encoding="utf-8"))
          audit = json.loads((root / "data" / "factor_audit" / "index.json").read_text(encoding="utf-8"))
          assert manifest["factor_count"] == len(catalog)
          assert manifest["audit_factor_count"] == audit["n_factors"] == len(audit["factors"])
          assert "DEPLOY_VERSION" not in (root / "index.html").read_text(encoding="utf-8")
          if (root / "factor_audit.html").exists():
              assert "DEPLOY_VERSION" not in (root / "factor_audit.html").read_text(encoding="utf-8")
          PY

      - name: JavaScript syntax checks
        run: |
          if [ -f frontend/app.js ]; then
            node --check frontend/app_holding_scope.js
            node --check frontend/app.js
          else
            node --check app_holding_scope.js
            node --check app.js
          fi
          node --check e2e/compose_validation.mjs
          node --check e2e/run_compose_validation.mjs
          node --check e2e/online_compose_validation.mjs
