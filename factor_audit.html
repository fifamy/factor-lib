<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>因子核对 · 因子库 v1.1.0</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="factor_audit.css?v=20260710161201">
</head>
<body>
  <header class="fa-header">
    <div class="fa-title">因子核对 <span class="fa-sub">每个因子：覆盖 · 分布 · 方向 · 对账 · 体检</span></div>
    <a class="fa-back" href="index.html">← 返回因子库</a>
  </header>
  <section class="fa-toolbar">
    <div class="fa-view-toggle" aria-label="视图切换">
      <button data-view="list" class="active">因子列表</button>
      <button data-view="dashboard">汇总看板</button>
    </div>
    <div class="fa-filters">
      <button data-filter="all" class="active">全部</button>
      <button data-filter="suspect">仅⚠可疑</button>
      <button data-filter="error">仅✗错误</button>
      <button data-filter="data_late">数据起步晚</button>
      <button data-filter="doc_missing">仅 Word 未收录</button>
      <button data-filter="formula_mismatch">仅口径不一致</button>
      <button data-filter="universe_mismatch">仅样本空间不一致</button>
      <button data-filter="parameter_mismatch">仅参数待补</button>
      <button data-filter="review_unreviewed">未复核</button>
      <button data-filter="review_in_progress">进行中</button>
      <button data-filter="review_issue">有问题</button>
      <button data-filter="review_passed">通过</button>
    </div>
    <input id="fa-search" type="search" placeholder="搜索 代码/名称/分类…">
    <label class="fa-reviewer-box">我是谁
      <input id="fa-reviewer-name" type="text" placeholder="填写姓名">
    </label>
    <span id="fa-reviewer-badge" class="fa-reviewer-badge">未填写</span>
    <span id="fa-stat" class="fa-stat"></span>
  </section>
  <section id="fa-methodology-warning" class="fa-methodology-warning">
    行业口径提示：行业分层、行业中性组合和行业市值中性化当前使用静态申万行业，不是历史申万行业 PIT；补齐历史行业归属表前，相关结论只作为辅助复核。
  </section>
  <main class="fa-main">
    <table id="fa-table" class="fa-table">
      <thead><tr>
        <th>因子</th><th>分类</th><th>计算公式</th><th>样本空间</th><th>参数覆盖</th><th>复核状态</th><th class="fa-help" title="覆盖率 = 该因子有值的(股票×月末)格 ÷ 同期 Word 股票池。&#10;· 低于100%：多为事件因子(业绩快报)、数据起步晚、或需长历史窗口导致的正常缺失。&#10;· 高于100%：说明实际计算样本超出 Word 股票池，需要复核。&#10;判断『算得对不对』请看右侧『对账』列；覆盖率只反映因子铺得多广。">覆盖率 ⓘ</th><th>分布</th>
        <th>方向</th><th>对账</th><th>体检</th>
      </tr></thead>
      <tbody id="fa-tbody"></tbody>
    </table>
    <section id="fa-dashboard" class="fa-dashboard hidden">
      <div class="fa-dashboard-head">
        <h2>汇总看板</h2>
        <button id="fa-export-reviews" class="fa-export-btn" type="button">导出 CSV</button>
      </div>
      <div id="fa-review-progress" class="fa-dashboard-card"></div>
      <div class="fa-dashboard-grid">
        <div class="fa-dashboard-card">
          <h3>按复核人</h3>
          <div id="fa-reviewer-summary" class="fa-review-list"></div>
        </div>
        <div class="fa-dashboard-card">
          <h3>被标有问题清单</h3>
          <div id="fa-review-issue-list" class="fa-review-list"></div>
        </div>
        <div class="fa-dashboard-card">
          <h3>未复核清单</h3>
          <div id="fa-review-unreviewed-list" class="fa-review-list"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="fa-drawer" class="fa-drawer hidden">
    <div class="fa-drawer-inner">
      <button id="fa-close" class="fa-close">✕</button>
      <div id="fa-detail"></div>
    </div>
  </div>
  <script src="vendor/katex.min.js"></script>
  <script src="factor_audit.js?v=20260710161201"></script>
</body>
</html>
